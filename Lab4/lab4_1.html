<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Оформление вертикального меню</title>
	<style>
		.menu {
			width:200px;
			background:#369;
		}
		
		.menu ul {
		/* установите тип списка none;*/
		list-style: none;
		/* уберите внешние поля;*/
		margin: 0;
    	/*установите внутренний отступ: сверху и снизу - 5px, слева и справа -  10px;*/  
			padding: 5px 10px;
		}
		
		.menu li {
		/*установите внутренний отступ: сверху и снизу - 5px, слева и справа -  0;*/ 
		padding: 5px 0;
		}
		
		.menu li a {
		/*сделайте элемент блочным;*/ 
		 display: block;
		/*установите внутренний отступ 10px;*/
		padding: 10px;
		/*преобразуйте символы в верхний регистр;*/ 
		text-transform: uppercase;
		/*уберите подчёркивание;*/ 
		text-decoration: none;
		/*задайте цвет фона;*/ 
		background-color: white;
		/*задайте цвет шрифта;*/ 
		color: #369; 
		}
		
        .menu li a:hover {
		/*задайте цвет фона;*/
		 background-color: #fff1ac; 
		/*задайте цвет шрифта;*/ 
		color: rgb(38, 70, 101);
		}
	</style>
</head>
<body>
	<nav class="menu">
		<ul>
			<li><a href="#">Фильмы</a></li>
			<li><a href="#">Музыка</a></li>
			<li><a href="#">Софт</a></li>
			<li><a href="#">Игры</a></li>
		</ul>
	</nav>
</body>
</html>
